<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title> COOKIE SERVER</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{
  font-family:'Rajdhani',sans-serif;
  color:#e8e0ff;
  background:#05010d;
  overflow-x:hidden;
}

/* ===== STATIC BG GLOW (no animation = fast) ===== */
.bg-glow{
  position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(circle at 15% 10%, rgba(255,47,214,.18), transparent 45%),
    radial-gradient(circle at 85% 25%, rgba(123,47,247,.15), transparent 45%),
    radial-gradient(circle at 50% 100%, rgba(0,229,255,.10), transparent 45%);
}
.grid-overlay{
  position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.3;
  background-image:
    linear-gradient(rgba(255,47,214,.06) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,240,255,.06) 1px, transparent 1px);
  background-size:48px 48px;
  mask-image:radial-gradient(ellipse at center, black 35%, transparent 80%);
}

.container{
  width:95%;max-width:820px;margin:0 auto 50px;
  position:relative;z-index:2;
}

/* ===== BANNER ===== */
.banner-wrap{
  margin-top:22px;border-radius:16px;overflow:hidden;position:relative;
  border:1px solid rgba(255,47,214,.3);
  box-shadow:0 6px 26px rgba(0,0,0,.6);
}
#bannerImg{width:100%;height:190px;object-fit:cover;display:block}
#bannerPlaceholder{
  width:100%;height:190px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;
  background:linear-gradient(135deg,#1a0533,#0b0320 60%,#041a2e);
}
.banner-title{
  font-family:'Orbitron',sans-serif;font-size:2rem;font-weight:900;
  letter-spacing:4px;color:#ff2fd6;text-shadow:0 0 18px rgba(255,47,214,.55);
}
.banner-sub{
  font-size:.9rem;letter-spacing:6px;color:#9d8fd6;text-transform:uppercase;
}
.banner-badge{
  position:absolute;top:12px;right:12px;
  background:rgba(5,1,13,.75);
  border:1px solid rgba(255,51,85,.45);color:#ff3355;
  padding:4px 12px;border-radius:30px;font-size:.72rem;font-weight:700;letter-spacing:2px;
}
.banner-badge.on{color:#00ff9d;border-color:rgba(0,255,157,.45)}

/* ===== CARDS ===== */
.card{
  margin-top:22px;border-radius:16px;
  background:rgba(16,8,40,.92);
  border:1px solid rgba(255,47,214,.22);
  padding:20px;
  box-shadow:0 6px 24px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.05);
  animation:fadeUp .5s ease both;
}
.card:nth-of-type(2){animation-delay:.08s}
.card:nth-of-type(3){animation-delay:.16s}
.card:nth-of-type(4){animation-delay:.24s}
.card:nth-of-type(5){animation-delay:.32s}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}

.card h2{
  font-family:'Orbitron',sans-serif;
  font-size:1rem;letter-spacing:3px;text-transform:uppercase;
  margin-bottom:16px;padding-bottom:10px;
  border-bottom:1px solid rgba(255,255,255,.1);
}
.card h2 .tag{
  float:right;font-family:'Rajdhani',sans-serif;font-size:.68rem;letter-spacing:2px;
  background:rgba(255,47,214,.15);border:1px solid rgba(255,47,214,.4);color:#ff8ae8;
  padding:3px 10px;border-radius:20px;font-weight:600;
}
#connStatus{
  display:inline-block;width:8px;height:8px;border-radius:50%;
  background:#ff3355;margin-right:6px;vertical-align:middle;
}
#connStatus.on{background:#00ff9d;box-shadow:0 0 8px #00ff9d}

/* ===== MONITOR ===== */
.monitor-grid{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;
}
.stat{
  background:rgba(255,255,255,.04);
  border:1px solid rgba(255,255,255,.1);
  border-radius:12px;padding:14px;text-align:center;
  transition:transform .15s, border-color .15s;
}
.stat:hover{transform:translateY(-3px);border-color:rgba(255,47,214,.5)}
.stat .icon{font-size:1.3rem;display:block;margin-bottom:4px}
.stat .val{
  font-family:'Orbitron',sans-serif;font-size:1.4rem;font-weight:700;display:block;
  color:#fff;text-shadow:0 0 12px rgba(0,240,255,.55);letter-spacing:1px;
}
.stat .lbl{font-size:.72rem;letter-spacing:2px;color:#9d8fd6;text-transform:uppercase;font-weight:600}
.stat.pink .val{text-shadow:0 0 12px rgba(255,47,214,.6)}
.stat.gold .val{text-shadow:0 0 12px rgba(255,215,0,.55)}

/* ===== FORM ===== */
label{
  display:block;margin-top:13px;font-weight:600;font-size:.83rem;
  letter-spacing:1.5px;text-transform:uppercase;color:#c9b8ff;
}
label .req{color:#ff2fd6}
input[type="text"],input[type="number"],select,textarea{
  width:100%;padding:12px 14px;margin-top:6px;border-radius:10px;
  background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.14);
  color:#fff;font-size:15px;font-family:'Rajdhani',sans-serif;
  outline:none;transition:border-color .15s, box-shadow .15s;
}
input:focus,select:focus,textarea:focus{
  border-color:#ff2fd6;
  box-shadow:0 0 10px rgba(255,47,214,.3);
}
select option{background:#14082e;color:#fff}
textarea{
  height:110px;resize:vertical;
  font-family:Consolas,monospace;font-size:.85rem;
  background:rgba(5,1,13,.7);color:#7dffce;
}
input[type="file"]{color:#9d8fd6;font-size:.85rem}
input[type="file"]::file-selector-button{
  background:rgba(255,47,214,.15);border:1px solid rgba(255,47,214,.4);color:#ff8ae8;
  padding:7px 14px;border-radius:7px;margin-right:10px;cursor:pointer;font-weight:600;
  font-family:'Rajdhani',sans-serif;
}
input[type="file"]::file-selector-button:hover{background:rgba(255,47,214,.3)}

/* segmented toggle */
.seg{
  display:flex;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);
  border-radius:10px;padding:4px;margin-top:6px;gap:4px;
}
.seg button{
  flex:1;background:transparent;border:none;color:#9d8fd6;padding:9px;
  border-radius:8px;font-weight:700;cursor:pointer;font-family:'Rajdhani',sans-serif;
  letter-spacing:1px;font-size:.9rem;
}
.seg button.active{
  background:linear-gradient(90deg,rgba(255,47,214,.35),rgba(168,85,247,.35));
  color:#fff;
}

/* ===== BUTTONS ===== */
.btn{
  width:100%;padding:14px;margin-top:18px;border:none;border-radius:12px;
  font-family:'Orbitron',sans-serif;font-size:.9rem;font-weight:700;letter-spacing:3px;
  color:#fff;cursor:pointer;transition:transform .15s, filter .15s;
}
.btn:hover{transform:translateY(-2px);filter:brightness(1.12)}
.btn:active{transform:translateY(0)}
.btn.start{
  background:linear-gradient(90deg,#ff2fd6,#a855f7);
  box-shadow:0 4px 18px rgba(255,47,214,.4);
}
.btn.stop{
  background:linear-gradient(90deg,#ff3355,#ff6a00);
  box-shadow:0 4px 18px rgba(255,51,85,.35);
}

/* ===== LOG ===== */
#log{
  height:210px;overflow-y:auto;border-radius:12px;padding:12px 14px;
  background:#020108;border:1px solid rgba(0,240,255,.18);
  font-family:Consolas,monospace;font-size:.8rem;line-height:1.6;
  color:#9ff;white-space:pre-wrap;
  box-shadow:inset 0 0 20px rgba(0,0,0,.8);
}
#log .t{color:#6d5fa8}
#log .ok{color:#00ff9d}
#log .warn{color:#ffd700}
#log .err{color:#ff3355}
#log .info{color:#00f0ff}
#log::-webkit-scrollbar{width:8px}
#log::-webkit-scrollbar-track{background:#0a0418}
#log::-webkit-scrollbar-thumb{background:#3d2b6e;border-radius:8px}

.footer{
  text-align:center;margin-top:26px;color:#5c4f8f;font-size:.72rem;letter-spacing:2px;
  text-transform:uppercase;font-family:'Orbitron',sans-serif;
}
.footer b{color:#ff2fd6}
.hidden{display:none}
</style>
</head>
<body>

<div class="bg-glow"></div>
<div class="grid-overlay"></div>

<div class="container">

  <!-- ============ BANNER ============ -->
  <div class="banner-wrap">
    <img id="bannerImg" class="hidden" src="" alt="Banner">
    <div id="bannerPlaceholder">
      <div class="banner-title">HENRY-X</div>
      <div class="banner-sub">— Cookie Server —</div>
    </div>
    <div class="banner-badge" id="bannerBadge">● OFFLINE</div>
  </div>

  <!-- ============ LIVE MONITOR ============ -->
  <div class="card">
    <h2> Live Monitor <span class="tag"><span id="connStatus" class="off"></span><span id="connText">OFFLINE</span></span></h2>
    <div class="monitor-grid">
      <div class="stat">
        <span class="icon">🕒</span>
        <span class="val" id="uptimeValue">0h 0m 0s</span>
        <span class="lbl">Uptime</span>
      </div>
      <div class="stat pink">
        <span class="icon">🚀</span>
        <span class="val" id="activeTasks">0</span>
        <span class="lbl">Active Tasks</span>
      </div>
      <div class="stat gold">
        <span class="icon">📨</span>
        <span class="val" id="sent">0</span>
        <span class="lbl">Messages Sent</span>
      </div>
    </div>
  </div>

  <!-- ============ START TASK ============ -->
  <div class="card">
    <h2>▶ Start Task <span class="tag">RUN</span></h2>

    <label>Cookie Input Method</label>
    <div class="seg" id="cookieSeg">
      <button class="active" data-m="file" onclick="setMethod('file')">📁 Upload File</button>
      <button data-m="paste" onclick="setMethod('paste')">📋 Paste Cookies</button>
    </div>

    <div id="fileInputArea">
      <label>Cookie File <span class="req">*</span></label>
      <input type="file" id="cookieFile" accept=".txt">
    </div>

    <div id="pasteInputArea" class="hidden">
      <label>Paste Cookies <span class="req">*</span></label>
      <textarea id="cookieText" placeholder="Yahan cookies paste karo..."></textarea>
    </div>

    <label>Message File <span class="req">*</span></label>
    <input type="file" id="msg" accept=".txt">

    <label>Thread ID <span class="req">*</span></label>
    <input type="text" id="thread" placeholder="Thread ID daalo...">

    <label>Delay (seconds)</label>
    <input type="number" id="delay" value="10">

    <label>Haters Name</label>
    <input type="text" id="haters" placeholder="...">

    <label>Last Name</label>
    <input type="text" id="last" placeholder="...">

    <button id="startBtn" class="btn start">⚡ START TASK</button>
  </div>

  <!-- ============ STOP TASK ============ -->
  <div class="card">
    <h2>⏹ Stop Task <span class="tag">KILL</span></h2>
    <label>Task ID <span class="req">*</span></label>
    <input type="text" id="taskIdInput" placeholder="Task ID yahan daalo...">
    <button id="stopBtn" class="btn stop">⏹ STOP</button>
  </div>

  <!-- ============ LOG ============ -->
  <div class="card">
    <h2>💻 Terminal Log <span class="tag">REALTIME</span></h2>
    <div id="log">[system] Booting...\n</div>
  </div>

  <div class="footer">⚡ <b>COOKIE SERVER</b> • Legend Mode v2.1 ⚡</div>
</div>

<script>
/* ============================================================
   👑 BANNER CONFIG — APNI IMAGE KA LINK YAHAN DAALO 👑
   Neeche double quotes ke andar apni image ka link paste karo.
   Link khali chhoda to default COOKIE SERVER banner dikhega.
   ============================================================ */
const BANNER_URL = "";

/* ================= LOG SYSTEM ================= */
const logBox = document.getElementById("log");
function log(msg, type = "info"){
  const t = new Date().toLocaleTimeString();
  const cls = {info:"info", ok:"ok", warn:"warn", err:"err"}[type] || "info";
  logBox.innerHTML += `<span class="t">[${t}]</span> <span class="${cls}">${msg}</span>\n`;
  logBox.scrollTop = logBox.scrollHeight;
}

/* ================= BANNER RENDER ================= */
(function initBanner(){
  if(BANNER_URL){
    const img = document.getElementById("bannerImg");
    img.src = BANNER_URL;
    img.onload = () => {
      img.classList.remove("hidden");
      document.getElementById("bannerPlaceholder").classList.add("hidden");
    };
    img.onerror = () => log("⚠️ Banner image load nahi hui — link check karo", "warn");
  }
})();

/* ================= SEGMENTED METHOD TOGGLE ================= */
let cookieMethod = "file";
function setMethod(m){
  cookieMethod = m;
  document.getElementById("cookieSeg").querySelectorAll("button").forEach(b =>
    b.classList.toggle("active", b.dataset.m === m));
  document.getElementById("fileInputArea").classList.toggle("hidden", m !== "file");
  document.getElementById("pasteInputArea").classList.toggle("hidden", m !== "paste");
}

/* ================= WEBSOCKET ================= */
let ws;
function connect(){
  ws = new WebSocket((location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/ws");

  ws.onopen = () => {
    log("✅ Connected to Server", "ok");
    setConn(true);
  };

  ws.onclose = () => {
    log("⚠️ Connection Lost, reconnecting...", "warn");
    setConn(false);
    setTimeout(connect, 3000);
  };

  ws.onerror = () => setConn(false);

  ws.onmessage = (e) => {
    let d;
    try{ d = JSON.parse(e.data); }catch{ return; }

    if(d.type === "log") log(d.message);

    if(d.type === "task_started"){
      log(`🚀 Task started | ID: ${d.taskId}`, "ok");
      document.getElementById("taskIdInput").value = d.taskId;
    }

    if(d.type === "stopped"){
      log(`⏹ Task stopped | ID: ${d.taskId}`, "warn");
    }

    if(d.type === "monitor_data"){
      const totalSeconds = d.uptime;
      const hours = Math.floor(totalSeconds / 3600);
      const minutes = Math.floor((totalSeconds % 3600) / 60);
      const seconds = totalSeconds % 60;
      document.getElementById("uptimeValue").textContent = `${hours}h ${minutes}m ${seconds}s`;
      document.getElementById("activeTasks").textContent = d.activeTasks;
      document.getElementById("sent").textContent = d.totalSent;
    }
  };
}

function setConn(on){
  const dot = document.getElementById("connStatus");
  const txt = document.getElementById("connText");
  dot.className = on ? "on" : "off";
  txt.textContent = on ? "ONLINE" : "OFFLINE";
  const badge = document.getElementById("bannerBadge");
  badge.textContent = on ? "● LIVE" : "● OFFLINE";
  badge.classList.toggle("on", on);
}

/* keep-alive ping */
setInterval(() => {
  if(ws && ws.readyState === 1) ws.send(JSON.stringify({type:"ping"}));
}, 25000);

/* monitor polling */
setInterval(() => {
  if(ws && ws.readyState === 1) ws.send(JSON.stringify({type:"monitor"}));
}, 2000);

/* ================= START TASK ================= */
document.getElementById("startBtn").onclick = () => {
  const msgFile = document.getElementById("msg").files[0];
  if(!msgFile) return alert("⚠️ Message file select karo!");

  const sendTask = (cookies) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      ws.send(JSON.stringify({
        type: "start",
        cookieContent: cookies,
        messageContent: e.target.result,
        threadID: document.getElementById("thread").value,
        delay: document.getElementById("delay").value,
        hatersName: document.getElementById("haters").value,
        lastHereName: document.getElementById("last").value
      }));
      log("⏳ Sending task request...", "warn");
    };
    reader.readAsText(msgFile);
  };

  if(cookieMethod === "file"){
    const f = document.getElementById("cookieFile").files[0];
    if(!f) return alert("⚠️ Cookie file upload karo!");
    const r = new FileReader();
    r.onload = e => sendTask(e.target.result);
    r.readAsText(f);
  } else {
    const p = document.getElementById("cookieText").value;
    if(!p.trim()) return alert("⚠️ Cookies paste karo!");
    sendTask(p);
  }
};

/* ================= STOP TASK ================= */
document.getElementById("stopBtn").onclick = () => {
  const id = document.getElementById("taskIdInput").value;
  if(!id) return alert("⚠️ Task ID daalo!");
  if(ws && ws.readyState === 1){
    ws.send(JSON.stringify({type:"stop_by_id", taskId:id}));
    log(`⏹ Stop request sent for ${id}`, "warn");
  } else {
    alert("⚠️ Server se connection nahi hai!");
  }
};

/* INIT */
log("🔌 Initializing WebSocket...", "info");
connect();
</script>
</body>
</html>
