<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>⚡ COOKIE SERVER | LEGEND MODE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --neon-pink:#ff2fd6;
  --neon-cyan:#00f0ff;
  --neon-purple:#a855f7;
  --neon-gold:#ffd700;
  --bg:#05010d;
  --card:rgba(16,8,40,0.55);
  --border:rgba(255,47,214,0.25);
  --text:#e8e0ff;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{
  font-family:'Rajdhani',sans-serif;
  color:var(--text);
  background:var(--bg);
  overflow-x:hidden;
  position:relative;
}

/* ====== ANIMATED AURORA BLOBS ====== */
.blob{
  position:fixed;border-radius:50%;filter:blur(120px);
  opacity:.45;z-index:0;pointer-events:none;animation:drift 20s ease-in-out infinite;
}
.blob1{width:520px;height:520px;background:#ff2fd6;top:-140px;left:-120px}
.blob2{width:480px;height:480px;background:#7b2ff7;top:20%;right:-160px;animation-delay:-6s}
.blob3{width:420px;height:420px;background:#00e5ff;bottom:-120px;left:25%;animation-delay:-12s}
@keyframes drift{
  0%,100%{transform:translate(0,0) scale(1)}
  33%{transform:translate(60px,-40px) scale(1.15)}
  66%{transform:translate(-40px,50px) scale(.9)}
}

/* ====== PARTICLE NETWORK CANVAS ====== */
#particles{
  position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.8;
}

/* ====== GRID OVERLAY ====== */
.grid-overlay{
  position:fixed;inset:0;z-index:0;pointer-events:none;
  background-image:
    linear-gradient(rgba(255,47,214,.05) 1px,transparent 1px),
    linear-gradient(90deg,rgba(0,240,255,.05) 1px,transparent 1px);
  background-size:44px 44px;
  mask-image:radial-gradient(ellipse at center,black 30%,transparent 75%);
}

/* ====== SCANLINE ====== */
.scanline{
  position:fixed;left:0;right:0;height:120px;z-index:1;pointer-events:none;
  background:linear-gradient(180deg,transparent,rgba(255,47,214,.06),transparent);
  animation:scan 7s linear infinite;
}
@keyframes scan{0%{top:-130px}100%{top:110vh}}

.container{
  width:95%;max-width:860px;margin:0 auto 60px;
  position:relative;z-index:2;
}

/* ====== BANNER ====== */
.banner-wrap{
  margin-top:24px;position:relative;border-radius:20px;overflow:hidden;
  border:1px solid var(--border);
  box-shadow:0 0 40px rgba(255,47,214,.25), 0 0 90px rgba(123,47,247,.15);
  animation:fadeUp .7s ease;
}
.banner-wrap::before{
  content:'';position:absolute;inset:-2px;z-index:-1;border-radius:22px;
  background:linear-gradient(90deg,var(--neon-pink),var(--neon-cyan),var(--neon-purple),var(--neon-pink));
  background-size:300% 100%;animation:borderFlow 6s linear infinite;
  filter:blur(6px);opacity:.6;
}
@keyframes borderFlow{0%{background-position:0% 0}100%{background-position:300% 0}}

#bannerImg{
  width:100%;height:210px;object-fit:cover;display:block;
}
#bannerPlaceholder{
  width:100%;height:210px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
  background:radial-gradient(circle at 30% 30%,rgba(255,47,214,.25),transparent 60%),
             radial-gradient(circle at 70% 70%,rgba(0,240,255,.2),transparent 60%),
             #0b0320;
}
.banner-title{
  font-family:'Orbitron',sans-serif;font-size:2.2rem;font-weight:900;
  letter-spacing:4px;
  background:linear-gradient(90deg,#ff2fd6,#00f0ff,#ff2fd6);
  background-size:200% auto;
  -webkit-background-clip:text;background-clip:text;color:transparent;
  animation:shine 3s linear infinite;text-shadow:none;
}
@keyframes shine{to{background-position:200% center}}
.banner-sub{
  font-size:1rem;letter-spacing:6px;color:#9d8fd6;text-transform:uppercase;
}
.banner-badge{
  position:absolute;top:12px;right:12px;
  background:rgba(5,1,13,.7);backdrop-filter:blur(8px);
  border:1px solid rgba(0,240,255,.4);color:var(--neon-cyan);
  padding:4px 12px;border-radius:30px;font-size:.75rem;font-weight:700;letter-spacing:2px;
  box-shadow:0 0 14px rgba(0,240,255,.35);animation:pulseGlow 2s ease-in-out infinite;
}
@keyframes pulseGlow{50%{box-shadow:0 0 26px rgba(0,240,255,.6)}}

.banner-edit{
  position:absolute;bottom:0;left:0;right:0;
  background:rgba(5,1,13,.78);backdrop-filter:blur(10px);
  display:flex;gap:8px;padding:10px 12px;align-items:center;flex-wrap:wrap;
}
.banner-edit input[type="text"]{
  flex:1;min-width:180px;
  background:rgba(255,255,255,.07);border:1px solid rgba(255,47,214,.35);
  color:#fff;padding:9px 14px;border-radius:8px;font-family:'Rajdhani',sans-serif;font-size:.95rem;
  transition:.25s;
}
.banner-edit input[type="text"]:focus{outline:none;border-color:var(--neon-cyan);box-shadow:0 0 14px rgba(0,240,255,.35)}
.banner-edit input[type="file"]{color:#9d8fd6;font-size:.8rem;max-width:170px}
.mini-btn{
  background:linear-gradient(90deg,#ff2fd6,#a855f7);color:#fff;border:none;
  padding:9px 16px;border-radius:8px;font-weight:700;cursor:pointer;font-family:'Rajdhani',sans-serif;
  letter-spacing:1px;transition:.25s;
}
.mini-btn:hover{transform:translateY(-2px);box-shadow:0 0 18px rgba(255,47,214,.55)}
.mini-btn.cyan{background:linear-gradient(90deg,#00e5ff,#00b3ff)}
.mini-btn.cyan:hover{box-shadow:0 0 18px rgba(0,240,255,.55)}

/* ====== CARDS ====== */
.card{
  margin-top:26px;border-radius:18px;
  background:var(--card);
  border:1px solid var(--border);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  padding:20px;position:relative;overflow:hidden;
  box-shadow:0 8px 32px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.06);
  animation:fadeUp .7s ease both;
}
.card:nth-of-type(2){animation-delay:.1s}
.card:nth-of-type(3){animation-delay:.2s}
.card:nth-of-type(4){animation-delay:.3s}
.card:nth-of-type(5){animation-delay:.4s}
@keyframes fadeUp{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:translateY(0)}}

.card::after{
  content:'';position:absolute;top:0;left:-100%;width:60%;height:2px;
  background:linear-gradient(90deg,transparent,var(--neon-cyan),transparent);
  animation:sweep 5s ease-in-out infinite;
}
@keyframes sweep{0%,100%{left:-100%}50%{left:100%}}

.card h2{
  font-family:'Orbitron',sans-serif;
  font-size:1.05rem;letter-spacing:3px;text-transform:uppercase;
  margin-bottom:16px;padding-bottom:10px;
  border-bottom:1px solid rgba(255,255,255,.1);
  position:relative;
}
.card h2::after{
  content:'';position:absolute;left:0;bottom:-1px;width:80px;height:2px;
  background:linear-gradient(90deg,var(--neon-pink),transparent);
  box-shadow:0 0 12px var(--neon-pink);
}
.card h2 .tag{
  float:right;font-family:'Rajdhani',sans-serif;font-size:.65rem;letter-spacing:2px;
  background:rgba(255,47,214,.15);border:1px solid rgba(255,47,214,.4);color:#ff8ae8;
  padding:3px 10px;border-radius:20px;font-weight:600;
}

/* ====== LIVE MONITOR ====== */
.monitor-grid{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;
}
.stat{
  background:rgba(255,255,255,.04);
  border:1px solid rgba(255,255,255,.09);
  border-radius:14px;padding:14px;text-align:center;position:relative;overflow:hidden;
  transition:.3s;
}
.stat:hover{transform:translateY(-4px);border-color:rgba(255,47,214,.5);box-shadow:0 0 24px rgba(255,47,214,.25)}
.stat .icon{font-size:1.4rem;display:block;margin-bottom:4px;filter:drop-shadow(0 0 8px rgba(255,255,255,.4))}
.stat .val{
  font-family:'Orbitron',sans-serif;font-size:1.5rem;font-weight:700;display:block;
  color:#fff;text-shadow:0 0 16px rgba(0,240,255,.7);letter-spacing:1px;
}
.stat .lbl{font-size:.75rem;letter-spacing:2px;color:#9d8fd6;text-transform:uppercase;font-weight:600}
.stat.pink .val{text-shadow:0 0 16px rgba(255,47,214,.8)}
.stat.gold .val{text-shadow:0 0 16px rgba(255,215,0,.7)}
#connStatus{
  display:inline-block;width:9px;height:9px;border-radius:50%;
  background:#555;margin-right:6px;vertical-align:middle;
}
#connStatus.on{background:#00ff9d;box-shadow:0 0 12px #00ff9d;animation:blink 1.6s infinite}
#connStatus.off{background:#ff3355;box-shadow:0 0 12px #ff3355}
@keyframes blink{50%{opacity:.4}}

/* ====== FORM ====== */
label{
  display:block;margin-top:14px;font-weight:600;font-size:.85rem;
  letter-spacing:1.5px;text-transform:uppercase;color:#c9b8ff;
}
label .req{color:var(--neon-pink)}
input[type="text"],input[type="number"],select,textarea{
  width:100%;padding:12px 14px;margin-top:6px;border-radius:10px;
  background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.14);
  color:#fff;font-size:15px;font-family:'Rajdhani',sans-serif;
  transition:.25s;outline:none;
}
input:focus,select:focus,textarea:focus{
  border-color:var(--neon-pink);
  box-shadow:0 0 16px rgba(255,47,214,.35);
  background:rgba(255,255,255,.09);
}
select option{background:#14082e;color:#fff}
textarea{
  height:110px;resize:vertical;
  font-family:Consolas,monospace;font-size:.85rem;
  background:rgba(5,1,13,.6);color:#7dffce;
}
input[type="file"]{color:#9d8fd6;font-size:.85rem}
input[type="file"]::file-selector-button{
  background:rgba(255,47,214,.15);border:1px solid rgba(255,47,214,.4);color:#ff8ae8;
  padding:7px 14px;border-radius:7px;margin-right:10px;cursor:pointer;font-weight:600;
  font-family:'Rajdhani',sans-serif;transition:.25s;
}
input[type="file"]::file-selector-button:hover{background:rgba(255,47,214,.3)}

/* segmented control */
.seg{
  display:flex;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);
  border-radius:10px;padding:4px;margin-top:6px;gap:4px;
}
.seg button{
  flex:1;background:transparent;border:none;color:#9d8fd6;padding:9px;
  border-radius:8px;font-weight:700;cursor:pointer;font-family:'Rajdhani',sans-serif;
  letter-spacing:1px;font-size:.9rem;transition:.25s;
}
.seg button.active{
  background:linear-gradient(90deg,rgba(255,47,214,.35),rgba(168,85,247,.35));
  color:#fff;box-shadow:0 0 14px rgba(255,47,214,.3);
}

/* ====== BUTTONS ====== */
.btn{
  width:100%;padding:14px;margin-top:18px;border:none;border-radius:12px;
  font-family:'Orbitron',sans-serif;font-size:.95rem;font-weight:700;letter-spacing:3px;
  color:#fff;cursor:pointer;position:relative;overflow:hidden;
  transition:.3s;
}
.btn::before{
  content:'';position:absolute;top:0;left:-120%;width:60%;height:100%;
  background:linear-gradient(120deg,transparent,rgba(255,255,255,.35),transparent);
  transform:skewX(-25deg);transition:.5s;
}
.btn:hover::before{left:140%}
.btn:hover{transform:translateY(-3px)}
.btn.start{
  background:linear-gradient(90deg,#ff2fd6,#a855f7);
  box-shadow:0 4px 22px rgba(255,47,214,.45);
}
.btn.start:hover{box-shadow:0 8px 32px rgba(255,47,214,.7);filter:brightness(1.1)}
.btn.stop{
  background:linear-gradient(90deg,#ff3355,#ff6a00);
  box-shadow:0 4px 22px rgba(255,51,85,.4);
}
.btn.stop:hover{box-shadow:0 8px 32px rgba(255,51,85,.65);filter:brightness(1.1)}
.btn:active{transform:translateY(0)}

/* ====== TERMINAL LOG ====== */
#log{
  height:220px;overflow-y:auto;border-radius:12px;padding:12px 14px;
  background:#020108;border:1px solid rgba(0,240,255,.18);
  font-family:Consolas,monospace;font-size:.8rem;line-height:1.6;
  color:#9ff;white-space:pre-wrap;
  box-shadow:inset 0 0 30px rgba(0,0,0,.8), 0 0 20px rgba(0,240,255,.08);
}
#log .t{color:#6d5fa8}
#log .ok{color:#00ff9d}
#log .warn{color:#ffd700}
#log .err{color:#ff3355}
#log .info{color:#00f0ff}
#log::after{
  content:'█';color:var(--neon-cyan);animation:blink 1s step-end infinite;
}
#log::-webkit-scrollbar{width:8px}
#log::-webkit-scrollbar-track{background:#0a0418}
#log::-webkit-scrollbar-thumb{background:linear-gradient(#ff2fd6,#00f0ff);border-radius:8px}
#log::-webkit-scrollbar-thumb:hover{background:linear-gradient(#ff2fd6,#a855f7)}

/* footer */
.footer{
  text-align:center;margin-top:30px;color:#5c4f8f;font-size:.75rem;letter-spacing:2px;
  text-transform:uppercase;font-family:'Orbitron',sans-serif;
  animation:fadeUp .7s .5s both;
}
.footer b{color:var(--neon-pink);text-shadow:0 0 10px rgba(255,47,214,.6)}
.hidden{display:none}
</style>
</head>
<body>

<div class="blob blob1"></div>
<div class="blob blob2"></div>
<div class="blob blob3"></div>
<canvas id="particles"></canvas>
<div class="grid-overlay"></div>
<div class="scanline"></div>

<div class="container">

  <!-- ============ BANNER ============ -->
  <div class="banner-wrap">
    <img id="bannerImg" class="hidden" src="" alt="Banner">
    <div id="bannerPlaceholder">
      <div class="banner-title">⚡ COOKIE SERVER</div>
      <div class="banner-sub">— Legend Mode Online —</div>
    </div>
    <div class="banner-badge" id="bannerBadge">● LIVE</div>

    <div class="banner-edit">
      <input type="text" id="bannerUrl" placeholder="🔗 Banner image ka link yahan paste karo...">
      <button class="mini-btn" onclick="applyBanner()">APPLY LINK</button>
      <input type="file" id="bannerFile" accept="image/*" onchange="uploadBanner(this)">
      <button class="mini-btn cyan" onclick="resetBanner()">RESET</button>
    </div>
  </div>

  <!-- ============ LIVE MONITOR ============ -->
  <div class="card">
    <h2>📡 Live Monitor <span class="tag" id="connTag"><span id="connStatus" class="off"></span>OFFLINE</span></h2>
    <div class="monitor-grid">
      <div class="stat">
        <span class="icon">🕒</span>
        <span class="val" id="uptimeValue">0h 0m 0s</span>
        <span class="lbl">Uptime</span>
      </div>
      <div class="stat pink">
        <span class="icon">🚀</span>
        <span class="val" id="activeTasks">0</span>
        <span class="lbl">Active Tasks</span>
      </div>
      <div class="stat gold">
        <span class="icon">📨</span>
        <span class="val" id="sent">0</span>
        <span class="lbl">Messages Sent</span>
      </div>
    </div>
  </div>

  <!-- ============ START TASK ============ -->
  <div class="card">
    <h2>▶ Start Task <span class="tag">RUN</span></h2>

    <label>Cookie Input Method</label>
    <div class="seg" id="cookieSeg">
      <button class="active" data-m="file" onclick="setMethod('file')">📁 Upload File</button>
      <button data-m="paste" onclick="setMethod('paste')">📋 Paste Cookies</button>
    </div>

    <div id="fileInputArea">
      <label>Cookie File <span class="req">*</span></label>
      <input type="file" id="cookieFile" accept=".txt">
    </div>

    <div id="pasteInputArea" class="hidden">
      <label>Paste Cookies <span class="req">*</span></label>
      <textarea id="cookieText" placeholder="yahan cookies paste karo..."></textarea>
    </div>

    <label>Message File <span class="req">*</span></label>
    <input type="file" id="msg" accept=".txt">

    <label>Thread ID <span class="req">*</span></label>
    <input type="text" id="thread" placeholder="Thread ID daalo...">

    <label>Delay (seconds)</label>
    <input type="number" id="delay" value="10">

    <label>Haters Name</label>
    <input type="text" id="haters" placeholder="...">

    <label>Last Name</label>
    <input type="text" id="last" placeholder="...">

    <button id="startBtn" class="btn start">⚡ START TASK</button>
  </div>

  <!-- ============ STOP TASK ============ -->
  <div class="card">
    <h2>⏹ Stop Task <span class="tag">KILL</span></h2>
    <label>Task ID <span class="req">*</span></label>
    <input type="text" id="taskIdInput" placeholder="Task ID yahan daalo...">
    <button id="stopBtn" class="btn stop">⏹ STOP</button>
  </div>

  <!-- ============ LOG ============ -->
  <div class="card">
    <h2>💻 Terminal Log <span class="tag">REALTIME</span></h2>
    <div id="log">[system] Booting legendary mode...\n</div>
  </div>

  <div class="footer">⚡ <b>COOKIE SERVER</b> • Legend Mode v2.0 ⚡</div>
</div>

<script>
/* ================= BANNER SYSTEM ================= */
function applyBanner(){
  const url = document.getElementById('bannerUrl').value.trim();
  const img = document.getElementById('bannerImg');
  const ph  = document.getElementById('bannerPlaceholder');
  if(!url) return alert("Pehle image ka link paste karo!");
  img.src = url;
  img.onload = () => {
    img.classList.remove('hidden');
    ph.classList.add('hidden');
    localStorage.setItem('bannerUrl', url);
    log("🎨 Banner updated (link)", "info");
  };
  img.onerror = () => alert("❌ Image load nahi hui! Link check karo.");
}
function uploadBanner(input){
  const f = input.files[0];
  if(!f) return;
  const r = new FileReader();
  r.onload = e => {
    document.getElementById('bannerImg').src = e.target.result;
    document.getElementById('bannerImg').classList.remove('hidden');
    document.getElementById('bannerPlaceholder').classList.add('hidden');
    localStorage.setItem('bannerUrl', e.target.result);
    log("🎨 Banner uploaded", "info");
  };
  r.readAsDataURL(f);
}
function resetBanner(){
  document.getElementById('bannerImg').src = "";
  document.getElementById('bannerImg').classList.add('hidden');
  document.getElementById('bannerPlaceholder').classList.remove('hidden');
  document.getElementById('bannerUrl').value = "";
  localStorage.removeItem('bannerUrl');
  log("🎨 Banner reset to default", "warn");
}
(function loadSavedBanner(){
  const saved = localStorage.getItem('bannerUrl');
  if(saved){
    document.getElementById('bannerImg').src = saved;
    document.getElementById('bannerImg').classList.remove('hidden');
    document.getElementById('bannerPlaceholder').classList.add('hidden');
  }
})();

/* ================= SEGMENTED METHOD TOGGLE ================= */
let cookieMethod = "file";
function setMethod(m){
  cookieMethod = m;
  document.getElementById('cookieSeg').querySelectorAll('button').forEach(b =>
    b.classList.toggle('active', b.dataset.m === m));
  document.getElementById('fileInputArea').classList.toggle('hidden', m !== "file");
  document.getElementById('pasteInputArea').classList.toggle('hidden', m !== "paste");
}

/* ================= LOG SYSTEM ================= */
const logBox = document.getElementById("log");
function log(msg, type = "info"){
  const t = new Date().toLocaleTimeString();
  const colors = {info:"info", ok:"ok", warn:"warn", err:"err"};
  const cls = colors[type] || "info";
  logBox.innerHTML += `<span class="t">[${t}]</span> <span class="${cls}">${msg}</span>\n`;
  logBox.scrollTop = logBox.scrollHeight;
}

/* ================= WEBSOCKET ================= */
let ws;
function connect(){
  ws = new WebSocket((location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/ws");

  ws.onopen = () => {
    log("✅ Connected to Server", "ok");
    setConn(true);
  };

  ws.onclose = () => {
    log("⚠️ Connection Lost, reconnecting...", "warn");
    setConn(false);
    setTimeout(connect, 3000);
  };

  ws.onerror = () => setConn(false);

  ws.onmessage = (e) => {
    let d;
    try{ d = JSON.parse(e.data); }catch{ return; }

    if(d.type === "log") log(d.message);

    if(d.type === "task_started"){
      log(`🚀 Task started | ID: ${d.taskId}`, "ok");
      document.getElementById("taskIdInput").value = d.taskId;
    }

    if(d.type === "stopped"){
      log(`⏹ Task stopped | ID: ${d.taskId}`, "warn");
    }

    if(d.type === "monitor_data"){
      const totalSeconds = d.uptime;
      const hours = Math.floor(totalSeconds / 3600);
      const minutes = Math.floor((totalSeconds % 3600) / 60);
      const seconds = totalSeconds % 60;
      document.getElementById("uptimeValue").textContent = `${hours}h ${minutes}m ${seconds}s`;
      document.getElementById("activeTasks").textContent = d.activeTasks;
      document.getElementById("sent").textContent = d.totalSent;
    }
  };
}

function setConn(on){
  const dot = document.getElementById("connStatus");
  const tag = document.getElementById("connTag");
  dot.className = on ? "on" : "off";
  tag.innerHTML = `<span id="connStatus" class="${on?"on":"off"}"></span>${on ? "ONLINE" : "OFFLINE"}`;
  document.getElementById("bannerBadge").textContent = on ? "● LIVE" : "○ OFFLINE";
  document.getElementById("bannerBadge").style.color = on ? "#00ff9d" : "#ff3355";
}

/* keep-alive ping */
setInterval(() => {
  if(ws && ws.readyState === 1) ws.send(JSON.stringify({type:"ping"}));
}, 25000);

/* monitor polling */
setInterval(() => {
  if(ws && ws.readyState === 1) ws.send(JSON.stringify({type:"monitor"}));
}, 2000);

/* ================= START TASK ================= */
document.getElementById("startBtn").onclick = () => {
  const msgFile = document.getElementById("msg").files[0];
  if(!msgFile) return alert("⚠️ Message file select karo!");

  const sendTask = (cookies) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      ws.send(JSON.stringify({
        type: "start",
        cookieContent: cookies,
        messageContent: e.target.result,
        threadID: document.getElementById("thread").value,
        delay: document.getElementById("delay").value,
        hatersName: document.getElementById("haters").value,
        lastHereName: document.getElementById("last").value
      }));
      log("⏳ Sending task request...", "warn");
    };
    reader.readAsText(msgFile);
  };

  if(cookieMethod === "file"){
    const f = document.getElementById("cookieFile").files[0];
    if(!f) return alert("⚠️ Cookie file upload karo!");
    const r = new FileReader();
    r.onload = e => sendTask(e.target.result);
    r.readAsText(f);
  } else {
    const p = document.getElementById("cookieText").value;
    if(!p.trim()) return alert("⚠️ Cookies paste karo!");
    sendTask(p);
  }
};

/* ================= STOP TASK ================= */
document.getElementById("stopBtn").onclick = () => {
  const id = document.getElementById("taskIdInput").value;
  if(!id) return alert("⚠️ Task ID daalo!");
  if(ws && ws.readyState === 1){
    ws.send(JSON.stringify({type:"stop_by_id", taskId:id}));
    log(`⏹ Stop request sent for ${id}`, "warn");
  } else {
    alert("⚠️ Server se connection nahi hai!");
  }
};

/* ================= PARTICLES BACKGROUND ================= */
(function particles(){
  const c = document.getElementById("particles");
  const ctx = c.getContext("2d");
  let W, H, dots = [];
  const N = 70;

  function resize(){
    W = c.width = innerWidth;
    H = c.height = innerHeight;
  }
  resize();
  addEventListener("resize", resize);

  for(let i = 0; i < N; i++){
    dots.push({
      x: Math.random() * innerWidth,
      y: Math.random() * innerHeight,
      vx: (Math.random() - .5) * .45,
      vy: (Math.random() - .5) * .45,
      r: Math.random() * 1.8 + .6
    });
  }

  (function draw(){
    ctx.clearRect(0, 0, W, H);
    for(const d of dots){
      d.x += d.vx; d.y += d.vy;
      if(d.x < 0 || d.x > W) d.vx *= -1;
      if(d.y < 0 || d.y > H) d.vy *= -1;
      ctx.beginPath();
      ctx.arc(d.x, d.y, d.r, 0, Math.PI * 2);
      ctx.fillStyle = "rgba(255,47,214,.55)";
      ctx.fill();
    }
    for(let i = 0; i < dots.length; i++){
      for(let j = i + 1; j < dots.length; j++){
        const dx = dots[i].x - dots[j].x, dy = dots[i].y - dots[j].y;
        const dist = Math.hypot(dx, dy);
        if(dist < 130){
          ctx.beginPath();
          ctx.moveTo(dots[i].x, dots[i].y);
          ctx.lineTo(dots[j].x, dots[j].y);
          ctx.strokeStyle = `rgba(0,240,255,${(1 - dist/130) * .22})`;
          ctx.lineWidth = .6;
          ctx.stroke();
        }
      }
    }
    requestAnimationFrame(draw);
  })();
})();

log("🔌 Initializing WebSocket...", "info");
connect();
