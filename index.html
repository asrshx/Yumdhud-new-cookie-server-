<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>COOKIE SERVER OFFLINE</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;padding:0;
  min-height:100vh;
  font-family:'Segoe UI', Arial, sans-serif;
  color:#fff;
  background:linear-gradient(-45deg,#ff6a9e,#c850c0,#7b2ff7,#b06ab3);
  background-size:400% 400%;
  animation:gradientShift 12s ease infinite;
}
@keyframes gradientShift{
  0%{background-position:0% 50%}
  50%{background-position:100% 50%}
  100%{background-position:0% 50%}
}

.container{width:95%;max-width:800px;margin:10px auto}

.card{
  background:rgba(255,255,255,0.14);
  backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);
  padding:15px;
  margin-bottom:20px;
  border-radius:16px;
  border:1px solid rgba(255,255,255,0.28);
  box-shadow:0 8px 24px rgba(123,47,247,0.28);
}
.card h2{
  text-align:center;
  margin-top:0;
  font-size:1.25rem;
  letter-spacing:1px;
  padding-bottom:10px;
  border-bottom:1px solid rgba(255,255,255,0.25);
  color:#fff;
  text-shadow:0 0 12px rgba(255,105,180,0.8), 0 0 30px rgba(123,47,247,0.6);
}

label{
  display:block;
  margin-top:10px;
  font-weight:bold;
  font-size:0.9rem;
  color:#ffe6f2;
  text-shadow:0 1px 4px rgba(0,0,0,0.3);
}

input, select, textarea{
  width:100%;
  padding:12px;
  border-radius:10px;
  border:2px solid transparent;
  margin-top:6px;
  font-size:15px;
  box-sizing:border-box;
  background:rgba(255,255,255,0.96);
  color:#3a0d5c;
  transition:border-color .2s, box-shadow .2s;
}
input:focus, select:focus, textarea:focus{
  outline:none;
  border-color:#ff5f9e;
  box-shadow:0 0 12px rgba(255,95,158,0.55);
}
select option{background:#fff;color:#3a0d5c}

textarea{
  height:100px;
  resize:vertical;
  font-family:Consolas, monospace;
  background:#fff0f7;
  color:#5c0a3d;
}

button{
  cursor:pointer;
  font-weight:bold;
  border:none;
  margin-top:10px;
  transition:transform .2s, box-shadow .2s, filter .2s;
}

.green{
  background:linear-gradient(90deg,#ff5f9e,#a855f7);
  color:#fff;
  font-size:1rem;
  letter-spacing:1px;
  padding:13px;
  border-radius:10px;
  box-shadow:0 4px 18px rgba(255,95,158,0.5);
}
.green:hover{
  transform:translateY(-2px);
  box-shadow:0 8px 24px rgba(168,85,247,0.65);
}

.red{
  background:linear-gradient(90deg,#e53935,#d81b60);
  color:#fff;
  font-size:1rem;
  letter-spacing:1px;
  padding:13px;
  border-radius:10px;
  box-shadow:0 4px 18px rgba(216,27,96,0.5);
}
.red:hover{
  transform:translateY(-2px);
  box-shadow:0 8px 24px rgba(229,57,53,0.6);
}

#log{
  height:200px;
  overflow-y:auto;
  background:rgba(35,12,60,0.7);
  border:1px solid rgba(255,255,255,0.2);
  border-radius:10px;
  padding:10px;
  font-family:Consolas, monospace;
  font-size:12px;
  white-space:pre-wrap;
  color:#ffd6f0;
  box-shadow:inset 0 0 20px rgba(0,0,0,0.4);
}
#log::-webkit-scrollbar{width:8px}
#log::-webkit-scrollbar-thumb{background:linear-gradient(#ff5f9e,#7b2ff7);border-radius:8px}

.hidden{display:none}

.monitor-item{
  display:flex;
  justify-content:space-between;
  padding:6px 0;
  border-bottom:1px dashed rgba(255,255,255,0.15);
}
.monitor-item:last-child{border-bottom:none}
.monitor-label{
  color:#ffc2e0;
  font-weight:bold;
  text-shadow:0 0 8px rgba(255,105,180,0.6);
}
.monitor-item span:last-child{
  color:#fff;
  font-weight:bold;
  text-shadow:0 0 8px rgba(255,255,255,0.5);
}
</style>
</head>

<body>
<div class="container">

<div class="card">
<h2>𝐋𝐈𝐕𝐄 𝐌𝐎𝐍𝐈𝐓𝐎𝐑</h2>
<div class="monitor-item"><span class="monitor-label">🕒 Uptime</span><span id="uptimeValue">0h 0m 0s</span></div>
<div class="monitor-item"><span class="monitor-label">🚀 Active Tasks</span><span id="activeTasks">0</span></div>
<div class="monitor-item"><span class="monitor-label">📨 Messages Sent</span><span id="sent">0</span></div>
</div>

<div class="card">
<h2>𝐒𝐓𝐀𝐑𝐓 𝐓𝐀𝐒𝐊</h2>

<label>Cookie Input Method</label>
<select id="cookieMethod" onchange="toggleCookieInput()">
<option value="file">Upload Cookie File</option>
<option value="paste">Paste Cookies</option>
</select>

<div id="fileInputArea">
<label>Cookie File</label>
<input type="file" id="cookieFile" accept=".txt">
</div>

<div id="pasteInputArea" class="hidden">
<label>Paste Cookies</label>
<textarea id="cookieText"></textarea>
</div>

<label>Message File</label>
<input type="file" id="msg" accept=".txt">

<label>Thread ID</label>
<input type="text" id="thread">

<label>Delay (sec)</label>
<input type="number" id="delay" value="10">

<label>Haters Name</label>
<input type="text" id="haters">

<label>Last Name</label>
<input type="text" id="last">

<button id="startBtn" class="green">START TASK</button>
</div>

<div class="card">
<h2>STOP TASK</h2>
<input type="text" id="taskIdInput" placeholder="Task ID">
<button id="stopBtn" class="red">STOP</button>
</div>

<div class="card">
<h2>LOG</h2>
<div id="log">Waiting...</div>
</div>

</div>

<script>
let ws;
const logBox = document.getElementById("log");

function log(msg){
  logBox.innerHTML += `[${new Date().toLocaleTimeString()}] ${msg}\n`;
  logBox.scrollTop = logBox.scrollHeight;
}

function toggleCookieInput(){
  const m=document.getElementById("cookieMethod").value;
  document.getElementById("fileInputArea").classList.toggle("hidden",m!=="file");
  document.getElementById("pasteInputArea").classList.toggle("hidden",m!=="paste");
}

/* ================= WEBSOCKET CONNECTION ================= */

function connect(){
  ws = new WebSocket(
    (location.protocol==="https:"?"wss://":"ws://")+location.host+"/ws"
  );

  ws.onopen = () => log("✅ Connected to Server");

  ws.onclose = () => {
    log("⚠️ Connection Lost, reconnecting...");
    setTimeout(connect,3000);
  };

  ws.onmessage = (e)=>{
    let d;
    try{ d=JSON.parse(e.data); }catch{ return; }

    if(d.type==="log") log(d.message);

    if(d.type==="task_started"){
      log(`🚀 Task started | ID: ${d.taskId}`);
      document.getElementById("taskIdInput").value=d.taskId;
    }

    if(d.type==="stopped"){
      log(`⏹ Task stopped | ID: ${d.taskId}`);
    }

    if(d.type==="monitor_data"){
      // --- Formatting Uptime to H:M:S ---
      const totalSeconds = d.uptime;
      const hours = Math.floor(totalSeconds / 3600);
      const minutes = Math.floor((totalSeconds % 3600) / 60);
      const seconds = totalSeconds % 60;

      document.getElementById("uptimeValue").textContent = `${hours}h ${minutes}m ${seconds}s`;
      document.getElementById("activeTasks").textContent = d.activeTasks;
      document.getElementById("sent").textContent = d.totalSent;
    }
  };
}

/* 🔁 PING TO KEEP CONNECTION ALIVE */
setInterval(()=>{
  if(ws && ws.readyState===1){
    ws.send(JSON.stringify({type:"ping"}));
  }
},25000);

/* 🔁 REQUEST MONITOR DATA */
setInterval(()=>{
  if(ws && ws.readyState===1){
    ws.send(JSON.stringify({type:"monitor"}));
  }
},2000);

/* ================= START TASK LOGIC ================= */

document.getElementById("startBtn").onclick=()=>{
  const msgFileInput = document.getElementById("msg");
  const threadInput = document.getElementById("thread");
  const delayInput = document.getElementById("delay");
  const hatersInput = document.getElementById("haters");
  const lastInput = document.getElementById("last");

  const msgFile = msgFileInput.files[0];
  if(!msgFile) return alert("Please select a message file");

  const method = document.getElementById("cookieMethod").value;

  const sendTask = (cookies) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      ws.send(JSON.stringify({
        type: "start",
        cookieContent: cookies,
        messageContent: e.target.result,
        threadID: threadInput.value,
        delay: delayInput.value,
        hatersName: hatersInput.value,
        lastHereName: lastInput.value
      }));
      log("⏳ Sending task request...");
    };
    reader.readAsText(msgFile);
  };

  if(method === "file"){
    const f = document.getElementById("cookieFile").files[0];
    if(!f) return alert("Please upload a cookie file");
    const r = new FileReader();
    r.onload = e => sendTask(e.target.result);
    r.readAsText(f);
  } else {
    const pText = document.getElementById("cookieText").value;
    if(!pText.trim()) return alert("Please paste cookies");
    sendTask(pText);
  }
};

/* ================= STOP TASK LOGIC ================= */

document.getElementById("stopBtn").onclick=()=>{
  const id = document.getElementById("taskIdInput").value;
  if(!id) return alert("Enter Task ID to stop");
  if(ws && ws.readyState===1){
    ws.send(JSON.stringify({type:"stop_by_id", taskId:id}));
  }
};

// Initialize Connection
connect();
</script>
</body>

</html>
